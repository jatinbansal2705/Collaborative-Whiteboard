name: collaborative-whiteboard

services:
  postgres:
    image: postgres:16-alpine
    container_name: whiteboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
      POSTGRES_DB: whiteboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard -d whiteboard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - whiteboard

  redis:
    image: redis:7-alpine
    container_name: whiteboard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - whiteboard

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  whiteboard:
    driver: bridge
