name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/SHA) to deploy. Pass a previous deploy/N tag to roll back."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/whiteboard-api
  WEB_IMAGE: ghcr.io/${{ github.repository }}/whiteboard-web
  RELEASE_VERSION: ${{ github.sha }}
  # Only used by `prisma generate` during image builds.
  DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public

jobs:
  quality-gate:
    name: Quality gate (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  images:
    name: Build and push container images
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - id: meta
        name: Compute version tags
        run: echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.API_IMAGE }}:deploy-${{ github.run_number }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          build-args: |
            DATABASE_URL=${{ env.DATABASE_URL }}

      - name: Push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.WEB_IMAGE }}:deploy-${{ github.run_number }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT_WEB }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_RELEASE=${{ env.RELEASE_VERSION }}

  sentry-release:
    name: Sentry release
    needs: quality-gate
    if: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - project: SENTRY_PROJECT_API
          - project: SENTRY_PROJECT_WEB
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets[matrix.project] }}
          SENTRY_RELEASE: ${{ env.RELEASE_VERSION }}
        with:
          environment: production
          finalize: true

  vercel-deploy-web:
    name: Deploy web to Vercel
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: "--prod"
          working-directory: apps/web

  deploy-api-host:
    name: Deploy API to host (Render hook)
    needs: images
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Trigger Render deploy hook
        run: |
          response="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")"
          echo "Render deploy hook responded with ${response}"
          test "$response" = "200" || { echo "Deploy trigger failed"; exit 1; }

  health-gate:
    name: Health-check gate
    needs: [vercel-deploy-web, deploy-api-host]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify API health
        run: bash deploy/scripts/health-check.sh "${{ secrets.UPTIME_CHECK_URL_API }}" 180

      - name: Verify web health
        run: bash deploy/scripts/health-check.sh "${{ secrets.UPTIME_CHECK_URL_WEB }}" 120

  tag-deployment:
    name: Tag deployment
    needs: health-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Create versioned deploy tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="deploy/${{ github.run_number }}"
          git tag -f "$tag"
          git push origin "$tag" --force
          echo "Tagged deployment as ${tag} ($(git rev-parse HEAD))"
