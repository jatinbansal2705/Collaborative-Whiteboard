# =============================================================================
# Collaborative Whiteboard — virtual host
# - Port 80:  ACME challenges + /health, everything else redirects to HTTPS.
# - Port 443: TLS termination, security headers, gzip/brotli (from nginx.conf),
#             SPA routing via the Next.js server, API proxy and websocket
#             upgrade for Socket.IO (/socket.io/, namespace /boards).
#
# Certificates are mounted at /etc/nginx/certs (fullchain.pem + privkey.pem).
# =============================================================================

upstream whiteboard_web {
  server web:3001;
  keepalive 32;
}

upstream whiteboard_api {
  server api:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Let's Encrypt HTTP-01 challenges must stay on plain HTTP.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Uptime checks / container health probe hit this on plain HTTP.
  location = /health {
    proxy_pass http://whiteboard_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    access_log off;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # --- Security headers ------------------------------------------------------
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  # --- REST API --------------------------------------------------------------
  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://whiteboard_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Swagger docs + health behind the edge as well.
  location /docs {
    proxy_pass http://whiteboard_api/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /_health {
    proxy_pass http://whiteboard_api/health;
    access_log off;
  }

  # --- Socket.IO websocket upgrade -------------------------------------------
  location /socket.io/ {
    proxy_pass http://whiteboard_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
    proxy_buffering off;
  }

  # --- Next.js application (SSR + static assets + SPA routes) -----------------
  location / {
    proxy_pass http://whiteboard_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
