# =============================================================================
# Collaborative Whiteboard — nginx edge proxy (main configuration)
# TLS termination, gzip + brotli compression, request-id passthrough,
# rate-limit zones and websocket upgrade mapping live here; virtual hosts
# are defined in conf.d/*.conf.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Structured access log including the request id for correlation with the
  # API's structured logs (ADR-0009).
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent rt=$request_time '
                  'rid=$http_x_request_id upstream=$upstream_addr';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  types_hash_max_size 2048;
  server_tokens off;

  client_max_body_size 25m;
  client_body_timeout 12s;
  header_timeout 12s;

  # --- Compression -----------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/x-javascript text/xml application/xml
             application/xml+rss text/javascript image/svg+xml;

  brotli on;
  brotli_comp_level 5;
  brotli_min_length 1024;
  brotli_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

  # --- Rate limiting (edge) --------------------------------------------------
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_status 429;

  # --- WebSocket upgrade map -------------------------------------------------
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  include /etc/nginx/conf.d/*.conf;
}
